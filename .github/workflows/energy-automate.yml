name: Energy-Automate

on:
   push:
     branches:
       - main
   workflow_dispatch:

jobs:
     generate-energy-data:
       runs-on: ubuntu-latest

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Generate energy data
           run: |
             mkdir -p data

             echo "Date,Irradiance,PV_Output,Temperature" > data/energy_data.csv
             echo "2026-09-01,820,165.4,31.2" >> data/energy_data.csv
             echo "2026-09-02,760,151.8,30.5" >> data/energy_data.csv
             echo "2026-09-03,910,184.6,32.1" >> data/energy_data.csv
             echo "2026-09-04,680,132.7,29.8" >> data/energy_data.csv
             echo "2026-09-05,850,171.3,31.6" >> data/energy_data.csv

         - name: Display generated data
           run: |
             cat data/energy_data.csv

         - name: Upload energy data
           uses: actions/upload-artifact@v4
           with:
             name: energy-data
             path: data/energy_data.csv


     validate-pv-data:
       runs-on: ubuntu-latest

       needs: generate-energy-data

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Download energy data
           uses: actions/download-artifact@v4
           with:
             name: energy-data
             path: data

         - name: Validate PV data
           run: |
             echo "Validating PV generation data..."

             if [ ! -f data/energy_data.csv ]; then
               echo "ERROR: energy_data.csv not found"
               exit 1
             fi

             echo "PV data file found."

             awk -F',' 'NR > 1 {
               if ($3 == "" || $3 !~ /^[0-9]+(\.[0-9]+)?$/) {
                 print "ERROR: Invalid PV_Output value on line " NR
                 exit 1
               }
             }' data/energy_data.csv

             echo "PV_Output validation successful."

         - name: Display validated data
           run: |
             cat data/energy_data.csv


     validate-weather-data:
       runs-on: ubuntu-latest

       needs: generate-energy-data

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Download energy data
           uses: actions/download-artifact@v4
           with:
             name: energy-data
             path: data

         - name: Validate weather data
           run: |
             echo "Validating weather data..."

             if [ ! -f data/energy_data.csv ]; then
               echo "ERROR: energy_data.csv not found"
               exit 1
             fi

             echo "Weather data file found."

             awk -F',' 'NR > 1 {
               if ($2 == "" || $2 !~ /^[0-9]+(\.[0-9]+)?$/) {
                 print "ERROR: Invalid Irradiance value on line " NR
                 exit 1
               }

               if ($4 == "" || $4 !~ /^[0-9]+(\.[0-9]+)?$/) {
                 print "ERROR: Invalid Temperature value on line " NR
                 exit 1
               }
             }' data/energy_data.csv

             echo "Irradiance validation successful."
             echo "Temperature validation successful."

         - name: Display validated weather data
           run: |
             cat data/energy_data.csv


     calculate-performance:
       runs-on: ubuntu-latest

       needs: [validate-pv-data, validate-weather-data]

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Download energy data
           uses: actions/download-artifact@v4
           with:
             name: energy-data
             path: data

         - name: Calculate PV performance
           run: |
             echo "Calculating PV performance..."

             awk -F',' 'NR == 1 {
               print "Date,PV_Performance"
               next
             }
             {
               performance = $3 / $2
               printf "%s,%.3f\n", $1, performance
             }' data/energy_data.csv > data/performance.csv

             echo "PV performance calculation completed."

         - name: Display performance results
           run: |
             cat data/performance.csv

         - name: Upload performance data
           uses: actions/upload-artifact@v4
           with:
             name: performance-data
             path: data/performance.csv


     detect-anomalies:
       runs-on: ubuntu-latest

       needs: calculate-performance

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Download performance data
           uses: actions/download-artifact@v4
           with:
             name: performance-data
             path: data

         - name: Detect PV anomalies
           run: |
             echo "Detecting PV performance anomalies..."

             awk -F',' 'NR == 1 {
               print "Date,PV_Performance,Status"
               next
             }
             {
               if ($2 < 0.198) {
                 printf "%s,%s,ANOMALY\n", $1, $2
               } else {
                 printf "%s,%s,NORMAL\n", $1, $2
               }
             }' data/performance.csv > data/anomalies.csv

             echo "Anomaly detection completed."

         - name: Display anomaly results
           run: |
             cat data/anomalies.csv

         - name: Upload anomaly data
           uses: actions/upload-artifact@v4
           with:
             name: anomaly-data
             path: data/anomalies.csv


     generate-report:
       runs-on: ubuntu-latest

       needs: detect-anomalies

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Download anomaly data
           uses: actions/download-artifact@v4
           with:
             name: anomaly-data
             path: data

         - name: Generate energy report
           run: |
             echo "Generating energy analysis report..."

             echo "SOLAR PV ENERGY ANALYSIS REPORT" > data/energy_report.txt
             echo "================================" >> data/energy_report.txt
             echo "" >> data/energy_report.txt

             echo "PV Performance Results" >> data/energy_report.txt
             echo "-----------------------" >> data/energy_report.txt

             tail -n +2 data/anomalies.csv >> data/energy_report.txt

             echo "" >> data/energy_report.txt
             echo "Summary" >> data/energy_report.txt
             echo "-------" >> data/energy_report.txt

             normal_count=$(awk -F',' 'NR > 1 && $3 == "NORMAL" {count++} END {print count+0}' data/anomalies.csv)
             anomaly_count=$(awk -F',' 'NR > 1 && $3 == "ANOMALY" {count++} END {print count+0}' data/anomalies.csv)

             echo "Normal Records: $normal_count" >> data/energy_report.txt
             echo "Anomalies Detected: $anomaly_count" >> data/energy_report.txt

             echo "Energy report generated successfully."

         - name: Display energy report
           run: |
             cat data/energy_report.txt

         - name: Upload energy report
           uses: actions/upload-artifact@v4
           with:
             name: energy-report
             path: data/energy_report.txt
